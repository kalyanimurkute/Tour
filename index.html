<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bike Tour</title>
  <link rel="stylesheet" href="./style/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">BikeTour</div>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Routes</a>
        <a href="#">Offers</a>
        <a href="#">Contact</a>
      </nav>
      <button class="nav-button">Book</button>
    </header>

    <section class="hero">
      <div class="hero-text">
        <p>Explore India on Two Wheels</p>
        <h1>Ride the road less traveled.</h1>
        <span>Simple, guided, and memorable bike tours for every rider.</span>
        <div class="buttons">
          <button class="btn primary">Book a Tour</button>
          <button class="btn secondary">View Routes</button>
        </div>
      </div>

      <div class="hero-image">
        <div class="tag">Popular Route</div>
        <div class="trip-info">
          <small>Mountain Ride</small>
          <strong>Himalayan Escape</strong>
        </div>
      </div>
    </section>

    <section class="cards">
      <article class="card">
        <div class="img img-one"></div>
        <h3>Coastal Ride</h3>
        <p>Goa to Gokarna</p>
      </article>
      <article class="card">
        <div class="img img-two"></div>
        <h3>Desert Trail</h3>
        <p>Jaisalmer route</p>
      </article>
      <article class="card">
        <div class="img img-three"></div>
        <h3>Hill Loop</h3>
        <p>Meghalaya trip</p>
      </article>
    </section>
  </div>
</body>
</html>
